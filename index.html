
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="calculator">

            <h1>Tip Calculator</h1>
            <p class="subtitle">Calculate your bill and split it easily.</p>

            <div class="input-group">
                <label for="bill">Bill Amount (₹)</label>
                <input type="number" id="bill" placeholder="Enter bill amount" min="0">
            </div>

            <div class="input-group">
                <label>Select Tip Percentage</label>

                <div class="tip-options">
                    <button class="tip-btn" data-tip="5">5%</button>
                    <button class="tip-btn" data-tip="10">10%</button>
                    <button class="tip-btn active" data-tip="15">15%</button>
                    <button class="tip-btn" data-tip="20">20%</button>
                    <button class="tip-btn" data-tip="25">25%</button>
                </div>
            </div>

            <div class="input-group">
                <label for="people">Number of People</label>
                <input type="number" id="people" placeholder="Enter number of people" min="1" value="1">
            </div>

            <button id="calculate-btn">Calculate</button>

            <div class="results">
                <h2>Bill Summary</h2>

                <div class="result-row">
                    <span>Bill Amount</span>
                    <strong id="bill-result">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Tip Amount</span>
                    <strong id="tip-result">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Total Bill</span>
                    <strong id="total-result">₹0.00</strong>
                </div>

                <div class="result-row highlight">
                    <span>Per Person</span>
                    <strong id="person-result">₹0.00</strong>
                </div>
            </div>

            <button id="reset-btn">Reset Calculator</button>

            <p id="message"></p>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
